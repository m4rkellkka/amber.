spring.application.name=amber
server.port=${PORT:8080}

# Database: local PostgreSQL by default; override with env vars on a server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amber}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Load data only inside services, never lazily during JSON rendering
spring.jpa.open-in-view=false
