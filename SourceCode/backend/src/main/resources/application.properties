spring.application.name=amber
server.port=${PORT:8080}

# Database: local PostgreSQL by default; override with env vars on a server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/amber}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate creates/updates tables from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
# Load data only inside services, never lazily during JSON rendering
spring.jpa.open-in-view=false

# Optional local overrides (gitignored), e.g. app.admin-emails=you@example.com
spring.config.import=optional:file:./local.properties

# Spring's default in-memory user is not used: identity comes from Firebase tokens
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Firebase service account: file path (local) or full JSON content (hosting)
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:${user.home}/.secrets/amber-firebase-adminsdk.json}
app.firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

# Comma-separated admin emails; set via env var ADMIN_EMAILS or local.properties, never committed
app.admin-emails=${ADMIN_EMAILS:}

# Browser origins allowed to call the API (React dev server by default)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Demo clients, orders and questions for presentations; keep false on a public site
app.seed-demo=${SEED_DEMO:false}
